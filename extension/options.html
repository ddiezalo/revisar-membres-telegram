<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Configuració · Revisar membres</title><link rel="stylesheet" href="options.css"></head>
<body><main>
<header><h1>Configuració del PIN</h1><p>Les credencials de Telegram es desen xifrades. No es desa cap historial de comparacions.</p></header>
<p id="message" role="status"></p>
<section id="pin-unlock-section" class="controls" hidden>
  <form id="pin-unlock-form">
    <label>PIN actual <input id="pin-unlock-input" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="current-password" required></label>
    <button type="submit">Desbloqueja</button>
  </form>
</section>
<section id="pin-not-setup" class="controls" hidden>
  <p>Configura primer el PIN des del comparador.</p>
  <button id="open-dashboard" type="button">Obre el comparador</button>
</section>
<section id="pin-settings" class="controls" hidden>
  <h2>Canviar el PIN</h2>
  <form id="pin-change-form">
    <label>PIN actual<input id="pin-old" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="current-password" required></label>
    <label>PIN nou<input id="pin-next" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="new-password" required></label>
    <label>Confirma el PIN nou<input id="pin-next-confirm" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="new-password" required></label>
    <button type="submit">Canvia el PIN</button>
  </form>
</section>
<footer><a href="LICENSE" target="_blank" rel="noopener noreferrer">Llicència GPLv3</a> · <a href="THIRD_PARTY_NOTICES.md" target="_blank" rel="noopener noreferrer">Dependències</a></footer>
</main><script src="vault.js"></script><script src="options.js"></script></body></html>
